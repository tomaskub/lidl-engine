name: CI evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Evidence contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare diagnostics
        run: mkdir -p evidence/diagnostics evidence/screenshots
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        id: dependencies
        run: python -m pip install --per45-intentional-setup-failure -r ci/requirements.txt 2>&1 | tee evidence/diagnostics/setup.log
      - name: Test evidence contract
        id: tests
        run: python -m pytest --junitxml=evidence/junit.xml 2>&1 | tee evidence/diagnostics/tests.log
      - name: Typecheck
        id: typecheck
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python -m mypy 2>&1 | tee evidence/diagnostics/typecheck.log
      - name: Lint
        id: lint
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff check ci 2>&1 | tee evidence/diagnostics/lint.log
      - name: Formatting
        id: format
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff format --check ci 2>&1 | tee evidence/diagnostics/format.log
      - name: Collect revision and execution evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 ci/evidence.py collect --directory evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ci-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish CI evidence
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
      - name: Bind verification job result
        env:
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: python3 ci/evidence.py finalize --directory evidence --job-outcome "$VERIFICATION_RESULT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
