name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lidl_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lidl_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/lidl_test
      DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/lidl_test
      EVIDENCE_DIR: /tmp/lidl-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lidl-engine migrate
      - run: uv run lidl-engine migrate
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
      - run: LIDL_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
      - run: docker build -t lidl-engine:verify .
