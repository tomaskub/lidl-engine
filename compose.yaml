services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lidl
      POSTGRES_USER: lidl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lidl -d lidl"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: ${LIDL_ENV_FILE:-.env}
    command: [lidl-engine, migrate]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build: .
    env_file: ${LIDL_ENV_FILE:-.env}
    ports:
      - "${LIDL_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - evidence:/data/evidence:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  collector:
    build: .
    env_file: ${LIDL_ENV_FILE:-.env}
    command: [lidl-engine, refresh]
    volumes:
      - evidence:/data/evidence
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [collection]
volumes:
  database:
  evidence:
