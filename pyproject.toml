[project]
name = "lidl-engine"
version = "0.1.0"
description = "Private Lidl Poland offer collection and desktop browser"
requires-python = ">=3.12,<3.15"
dependencies = ["flask>=3.1,<4", "gunicorn>=23,<26", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "psycopg[binary]>=3.2,<4", "pydantic>=2.11,<3"]

[project.scripts]
lidl-engine = "lidl_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-beautifulsoup4>=4.12", "playwright>=1.55,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidl_engine"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: desktop HTMX check requiring installed Chromium"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
